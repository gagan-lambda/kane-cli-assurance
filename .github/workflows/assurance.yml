name: Kane CLI Assurance

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.testmuai/tests/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      prd_file:
        description: 'PRD file path (relative to repo root). Leave blank to auto-detect from docs/.'
        required: false
        default: ''
      tests:
        description: 'Comma-separated assurance test IDs to run (e.g. t-1,t-2). Leave blank to run all.'
        required: false
        default: ''
      parallel:
        description: 'Number of parallel workers'
        required: false
        default: '3'

jobs:
  assurance:
    name: Assurance suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli@latest

      - name: Authenticate
        run: |
          kane-cli login \
            --username "$LT_USERNAME" \
            --access-key "$LT_ACCESS_KEY" \
            ${KANE_PROJECT_ID:+--project-id "$KANE_PROJECT_ID"} \
            ${KANE_FOLDER_ID:+--folder-id "$KANE_FOLDER_ID"}
          kane-cli whoami
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
          KANE_PROJECT_ID: ${{ secrets.KANE_PROJECT_ID }}
          KANE_FOLDER_ID: ${{ secrets.KANE_FOLDER_ID }}

      # Auto-detect the first .md file in docs/ if no PRD path is given
      - name: Resolve PRD file
        id: prd
        run: |
          PRD="${{ github.event.inputs.prd_file }}"
          if [ -z "$PRD" ]; then
            PRD=$(find docs -maxdepth 1 -name "*.md" | sort | head -n 1)
          fi
          if [ -z "$PRD" ]; then
            echo "No PRD file found in docs/. Add a .md file or pass prd_file as input."
            exit 1
          fi
          echo "path=$PRD" >> "$GITHUB_OUTPUT"
          echo "Resolved PRD: $PRD"

      - name: Ingest PRD
        run: kane-cli context ingest "${{ steps.prd.outputs.path }}" --mode ci
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
          KANE_CLI_USER_AGENT: github-actions

      # Resolve which tests to run: use input IDs via --from-context, or pass all *_test.md paths
      - name: Resolve test paths
        id: tests
        run: |
          IDS="${{ github.event.inputs.tests }}"
          if [ -n "$IDS" ]; then
            echo "mode=context" >> "$GITHUB_OUTPUT"
            echo "ids=$IDS" >> "$GITHUB_OUTPUT"
            echo "Running by context IDs: $IDS"
          else
            PATHS=$(find .testmuai/tests -name '*_test.md' | sort | tr '\n' ' ' | sed 's/ $//')
            if [ -z "$PATHS" ]; then
              echo "No *_test.md files found under .testmuai/tests/."
              exit 1
            fi
            echo "mode=paths" >> "$GITHUB_OUTPUT"
            echo "paths=$PATHS" >> "$GITHUB_OUTPUT"
            echo "Running test files: $PATHS"
          fi

      - name: Run tests
        id: run
        run: |
          PARALLEL="${{ github.event.inputs.parallel || '3' }}"
          if [ "${{ steps.tests.outputs.mode }}" = "context" ]; then
            kane-cli testrun run \
              --from-context "${{ steps.tests.outputs.ids }}" \
              --parallel "$PARALLEL" \
              --headless 2>&1 | tee /tmp/testrun.ndjson
          else
            kane-cli testrun run \
              ${{ steps.tests.outputs.paths }} \
              --parallel "$PARALLEL" \
              --headless 2>&1 | tee /tmp/testrun.ndjson
          fi
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
          KANE_CLI_USER_AGENT: github-actions
        continue-on-error: true

      - name: Re-author failed tests
        id: reauthor
        if: steps.run.outputs.exit_code != '0'
        run: |
          FAILED=$(python3 -c "
          import json, sys
          paths = []
          try:
              with open('/tmp/testrun.ndjson') as f:
                  for line in f:
                      line = line.strip()
                      if not line: continue
                      try:
                          obj = json.loads(line)
                      except: continue
                      if obj.get('type') == 'testrun_authored_member_end' and obj.get('status') == 'failed':
                          paths.append(obj['path'])
          except FileNotFoundError: pass
          print(' '.join(paths))
          ")
          if [ -z "$FAILED" ]; then
            echo "No failed tests to re-author"
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Re-authoring: $FAILED"
          kane-cli testrun run $FAILED --author --headless 2>&1 | tee /tmp/reauthor.ndjson
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
          KANE_CLI_USER_AGENT: github-actions
        continue-on-error: true

      - name: Check coverage
        id: cover
        run: kane-cli cover gaps --json 2>&1 | tee /tmp/cover.json || true
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}

      - name: List evidence files
        if: always()
        run: |
          echo "=== Evidence directory contents ==="
          ls -la .testmuai/evidence/ 2>/dev/null || echo "Directory not found or empty"
          echo "=== Matching .evidence files ==="
          find .testmuai/evidence -name '*.evidence' 2>/dev/null || echo "None found"

      - name: Upload evidence packs
        if: always()
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.run_id }}
          path: .testmuai/evidence/*.evidence
          retention-days: 30
          if-no-files-found: warn

      - name: Build job summary
        if: always()
        run: |
          python3 - <<'PYEOF'
          import json, os

          def parse_ndjson(path):
              summary, members = None, []
              try:
                  with open(path) as f:
                      for raw in f:
                          raw = raw.strip()
                          if not raw: continue
                          try: obj = json.loads(raw)
                          except: continue
                          t = obj.get("type", "")
                          if t == "testrun_summary":
                              summary = obj
                          elif t == "testrun_authored_member_end":
                              members.append(obj)
              except FileNotFoundError:
                  pass
              return summary, members

          def test_rows(members):
              rows = []
              for m in members:
                  s    = m.get("status", "?")
                  icon = "✅" if s == "passed" else "❌"
                  name = m.get("path", "?").split("/")[-1].replace("_test.md", "")
                  dur  = m.get("duration_s", "?")
                  rows.append(f"| {icon} | `{name}` | {s} | {dur}s |")
              return rows

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stdout")
          prd          = "${{ steps.prd.outputs.path }}"
          artifact_url = "${{ steps.evidence.outputs.artifact-url }}"

          # Initial run
          run_summary, run_members = parse_ndjson("/tmp/testrun.ndjson")
          if run_summary:
              exec_id  = run_summary.get("execution", {}).get("id", "")
              status   = run_summary.get("execution", {}).get("status", "unknown")
              totals   = run_summary.get("totals", {})
              passed   = totals.get("passed", "?")
              failed   = totals.get("failed", "?")
              total    = totals.get("tests",  "?")
              duration = round(run_summary.get("duration_s", 0))
          else:
              exec_id = status = ""; passed = failed = total = "?"; duration = "?"

          # Re-author run
          ra_summary, ra_members = parse_ndjson("/tmp/reauthor.ndjson")
          if ra_summary:
              ra_status  = ra_summary.get("execution", {}).get("status", "unknown")
              ra_totals  = ra_summary.get("totals", {})
              ra_passed  = ra_totals.get("passed", "?")
              ra_failed  = ra_totals.get("failed", "?")
              ra_total   = ra_totals.get("tests",  "?")
              ra_duration = round(ra_summary.get("duration_s", 0))
              # Final status is the re-author outcome
              final_status = ra_status
          else:
              ra_status = ra_passed = ra_failed = ra_total = ra_duration = None
              final_status = status

          badge = "🟢" if final_status == "passed" else "🔴"

          # Coverage gaps
          cover_rows = []
          try:
              with open("/tmp/cover.json") as f:
                  for raw in f:
                      raw = raw.strip()
                      if not raw: continue
                      try: obj = json.loads(raw)
                      except: continue
                      if obj.get("type") == "gaps":
                          for uc in obj.get("use_cases", []):
                              cover_rows.append(
                                  f"| {uc.get('id','?')} | {uc.get('title','?')} "
                                  f"| {uc.get('designed_pct','?')}% | {uc.get('proven_pct','?')}% |"
                              )
          except FileNotFoundError:
              pass

          lines = [
              f"## {badge} Kane CLI Assurance Results",
              "",
              "| | |",
              "|---|---|",
              f"| **PRD** | `{prd}` |",
              f"| **Status** | {final_status} |",
              f"| **Tests** | {total} total — {passed} passed, {failed} failed |",
              f"| **Duration** | {duration}s |",
          ]
          if artifact_url:
              label = f" (`{exec_id}`)" if exec_id else ""
              lines.append(f"| **Evidence** | [Download evidence pack]({artifact_url}){label} |")

          # Initial run test results
          rows = test_rows(run_members)
          if rows:
              lines += ["", "### Test Results", "", "| | Test | Status | Duration |", "|---|---|---|---|"] + rows

          # Re-author results (only if re-author ran)
          if ra_summary:
              ra_badge = "🟢" if ra_status == "passed" else "🔴"
              lines += [
                  "",
                  f"### {ra_badge} Re-author Results",
                  f"> {ra_total} re-authored — {ra_passed} passed, {ra_failed} failed ({ra_duration}s)",
                  "",
                  "| | Test | Status | Duration |",
                  "|---|---|---|---|",
              ] + test_rows(ra_members)

          # Coverage
          if cover_rows:
              lines += ["", "### Coverage", "", "| Use Case | Title | Designed | Proven |", "|---|---|---|---|"] + cover_rows
          else:
              lines += ["", "### Coverage", "", "_Run `kane-cli cover gaps` locally for the full coverage ribbon._"]

          # Evidence viewer — show serve command using execution ID
          if exec_id:
              lines += [
                  "",
                  "### View Evidence Locally",
                  "",
                  "> Download the `evidence-${{ github.run_id }}` artifact, extract it, then run:",
                  "",
                  f"```\nkane-cli evidence serve .testmuai/evidence/{exec_id}.evidence\n```",
              ]

          with open(summary_path, "a") as f:
              f.write("\n".join(lines) + "\n")
          PYEOF

      - name: Fail job if tests failed
        if: >
          (steps.reauthor.outcome != 'skipped' && steps.reauthor.outputs.exit_code != '0') ||
          (steps.reauthor.outcome == 'skipped' && steps.run.outputs.exit_code != '0')
        run: exit 1
