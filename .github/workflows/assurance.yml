name: Kane CLI Assurance

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.testmuai/tests/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      prd_file:
        description: 'PRD file path (relative to repo root). Leave blank to auto-detect from docs/.'
        required: false
        default: ''
      tests:
        description: 'Comma-separated assurance test IDs to run (e.g. t-1,t-2). Leave blank to run all.'
        required: false
        default: ''
      parallel:
        description: 'Number of parallel workers'
        required: false
        default: '3'

jobs:
  assurance:
    name: Assurance suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli@latest

      - name: Authenticate
        run: |
          kane-cli login \
            --username "$LT_USERNAME" \
            --access-key "$LT_ACCESS_KEY" \
            ${KANE_PROJECT_ID:+--project-id "$KANE_PROJECT_ID"} \
            ${KANE_FOLDER_ID:+--folder-id "$KANE_FOLDER_ID"}
          kane-cli whoami
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
          KANE_PROJECT_ID: ${{ secrets.KANE_PROJECT_ID }}
          KANE_FOLDER_ID: ${{ secrets.KANE_FOLDER_ID }}

      # Auto-detect the first .md file in docs/ if no PRD path is given
      - name: Resolve PRD file
        id: prd
        run: |
          PRD="${{ github.event.inputs.prd_file }}"
          if [ -z "$PRD" ]; then
            PRD=$(find docs -maxdepth 1 -name "*.md" | sort | head -n 1)
          fi
          if [ -z "$PRD" ]; then
            echo "No PRD file found in docs/. Add a .md file or pass prd_file as input."
            exit 1
          fi
          echo "path=$PRD" >> "$GITHUB_OUTPUT"
          echo "Resolved PRD: $PRD"

      - name: Ingest PRD
        run: kane-cli context ingest "${{ steps.prd.outputs.path }}" --mode ci
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
          KANE_CLI_USER_AGENT: github-actions

      # Resolve which tests to run: use input IDs via --from-context, or pass all *_test.md paths
      - name: Resolve test paths
        id: tests
        run: |
          IDS="${{ github.event.inputs.tests }}"
          if [ -n "$IDS" ]; then
            echo "mode=context" >> "$GITHUB_OUTPUT"
            echo "ids=$IDS" >> "$GITHUB_OUTPUT"
            echo "Running by context IDs: $IDS"
          else
            PATHS=$(find .testmuai/tests -name '*_test.md' | sort | tr '\n' ' ' | sed 's/ $//')
            if [ -z "$PATHS" ]; then
              echo "No *_test.md files found under .testmuai/tests/."
              exit 1
            fi
            echo "mode=paths" >> "$GITHUB_OUTPUT"
            echo "paths=$PATHS" >> "$GITHUB_OUTPUT"
            echo "Running test files: $PATHS"
          fi

      - name: Run tests
        id: run
        run: |
          PARALLEL="${{ github.event.inputs.parallel || '3' }}"
          if [ "${{ steps.tests.outputs.mode }}" = "context" ]; then
            kane-cli testrun run \
              --from-context "${{ steps.tests.outputs.ids }}" \
              --parallel "$PARALLEL" \
              --headless 2>&1 | tee /tmp/testrun.ndjson
          else
            kane-cli testrun run \
              ${{ steps.tests.outputs.paths }} \
              --parallel "$PARALLEL" \
              --headless 2>&1 | tee /tmp/testrun.ndjson
          fi
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
          KANE_CLI_USER_AGENT: github-actions
        continue-on-error: true

      - name: Check coverage
        id: cover
        run: kane-cli cover gaps --json 2>&1 | tee /tmp/cover.json || true
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}

      - name: Build job summary
        if: always()
        run: |
          python3 - <<'PYEOF'
          import json, os, sys

          ndjson_path = "/tmp/testrun.ndjson"
          cover_path  = "/tmp/cover.json"
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stdout")
          prd = "${{ steps.prd.outputs.path }}"
          run_id = "${{ github.run_id }}"

          # Parse testrun NDJSON
          summary_line = None
          member_lines = []
          try:
              with open(ndjson_path) as f:
                  for raw in f:
                      raw = raw.strip()
                      if not raw:
                          continue
                      try:
                          obj = json.loads(raw)
                      except Exception:
                          continue
                      t = obj.get("type", "")
                      if t == "testrun_summary":
                          summary_line = obj
                      elif t == "testrun_authored_member_end":
                          member_lines.append(obj)
          except FileNotFoundError:
              pass

          if summary_line:
              exec_id  = summary_line.get("execution", {}).get("id", "")
              status   = summary_line.get("execution", {}).get("status", "unknown")
              upload   = summary_line.get("upload", "skipped")
              totals   = summary_line.get("totals", {})
              passed   = totals.get("passed", "?")
              failed   = totals.get("failed", "?")
              total    = totals.get("tests",  "?")
              duration = round(summary_line.get("duration_s", 0))
          else:
              exec_id = status = upload = ""; passed = failed = total = "?"; duration = "?"

          badge = "🟢" if status == "passed" else "🔴"

          # Evidence link — only shown when upload succeeded
          evidence_row = ""
          if exec_id and upload != "skipped":
              url = f"https://kaneai.lambdatest.com/test-manager/executions/{exec_id}"
              evidence_row = f"| **Evidence** | [View execution on KaneAI]({url}) |"
          elif exec_id:
              artifact_url = f"https://github.com/${{ github.repository }}/actions/runs/{run_id}#artifacts"
              evidence_row = f"| **Evidence** | [Download from Actions artifact]({artifact_url}) (execution `{exec_id}`) |"

          # Parse coverage gaps
          cover_rows = []
          try:
              with open(cover_path) as f:
                  for raw in f:
                      raw = raw.strip()
                      if not raw:
                          continue
                      try:
                          obj = json.loads(raw)
                      except Exception:
                          continue
                      if obj.get("type") == "gaps":
                          for uc in obj.get("use_cases", []):
                              uid   = uc.get("id", "?")
                              title = uc.get("title", "?")
                              des   = uc.get("designed_pct", "?")
                              prv   = uc.get("proven_pct",   "?")
                              cover_rows.append(f"| {uid} | {title} | {des}% | {prv}% |")
          except FileNotFoundError:
              pass

          # Per-test results table
          test_rows = []
          for m in member_lines:
              s = m.get("status", "?")
              icon = "✅" if s == "passed" else "❌"
              path = m.get("path", "?").split("/")[-1].replace("_test.md", "")
              dur  = m.get("duration_s", "?")
              test_rows.append(f"| {icon} | `{path}` | {s} | {dur}s |")

          lines = [
              f"## {badge} Kane CLI Assurance Results",
              "",
              "| | |",
              "|---|---|",
              f"| **PRD** | `{prd}` |",
              f"| **Status** | {status} |",
              f"| **Tests** | {total} total — {passed} passed, {failed} failed |",
              f"| **Duration** | {duration}s |",
          ]
          if evidence_row:
              lines.append(evidence_row)

          if test_rows:
              lines += [
                  "",
                  "### Test Results",
                  "",
                  "| | Test | Status | Duration |",
                  "|---|---|---|---|",
              ] + test_rows

          if cover_rows:
              lines += [
                  "",
                  "### Coverage",
                  "",
                  "| Use Case | Title | Designed | Proven |",
                  "|---|---|---|---|",
              ] + cover_rows
          else:
              lines += [
                  "",
                  "### Coverage",
                  "",
                  "_Run `kane-cli cover gaps` locally for the full coverage ribbon._",
              ]

          with open(summary_path, "a") as f:
              f.write("\n".join(lines) + "\n")
          PYEOF

      - name: Upload evidence packs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.run_id }}
          path: .testmuai/evidence/*.evidence
          retention-days: 30

      - name: Fail job if tests failed
        if: steps.run.outputs.exit_code != '0'
        run: exit 1
